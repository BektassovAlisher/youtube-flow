services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lecture_agent
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lecture_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/lecture_agent
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - API_TOKEN=${API_TOKEN:-}
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL:-}
      - ALLOW_PRIVATE_URLS=${ALLOW_PRIVATE_URLS:-false}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - TTS_CONCURRENCY=${TTS_CONCURRENCY:-2}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-}
      - WHISPER_FALLBACK=${WHISPER_FALLBACK:-}
      - WHISPER_MAX_MINUTES=${WHISPER_MAX_MINUTES:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vector_storage:/app/vector_storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./frontend
    restart: always
    environment:
      - API_URL=http://api:8000
      - API_TOKEN=${API_TOKEN:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  vector_storage:
